[package]
name = "animate-chars"
version = "0.1.0"
edition = "2021"
authors = ["phiat"]
description = "A CLI tool for animating Unicode characters and browsing the entire Unicode space"
repository = "https://github.com/phiat/animate-chars-rs"
license = "MIT"

[[bin]]
name = "animate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
